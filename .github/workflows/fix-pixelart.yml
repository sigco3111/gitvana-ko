name: Fix PixelArt (one-off)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Remove PixelArt import and file
        run: python3 tools/fix_pixelart.py
      - name: Build with Pages base path
        env:
          GITHUB_ACTIONS: "true"
        run: |
          bun install
          bun run build
      - name: Commit and push (only after a passing build)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "fix: PixelArt 손상 파일 제거로 지금 플레이 예외 해결"
          git push
