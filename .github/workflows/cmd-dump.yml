name: cmd-dump
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dump
        run: |
          echo 'BEGIN' >> $GITHUB_STEP_SUMMARY
          awk "/name: 'commit'/{f=1} f" src/docs/commands/index.ts >> $GITHUB_STEP_SUMMARY
          echo 'END' >> $GITHUB_STEP_SUMMARY
