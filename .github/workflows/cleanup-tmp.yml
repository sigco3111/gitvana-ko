name: cleanup-tmp
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: remove temp files
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git rm -r -q --ignore-unmatch tools/dump tools/patches
          git rm -q --ignore-unmatch .github/workflows/cleanup-tmp.yml
          git commit -m 'chore(tmp): 번역 임시 파일 일괄 삭제 (tools/dump, tools/patches, cleanup-tmp)' || true
          git push origin HEAD:main
          echo '## CLEANUP' >> $GITHUB_STEP_SUMMARY
          ls tools >> $GITHUB_STEP_SUMMARY || true
