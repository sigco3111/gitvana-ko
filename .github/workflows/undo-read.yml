name: undo-read
on:
  workflow_dispatch:
jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: print undoing-changes
        run: |
          S=$(grep -n "'undoing-changes'" src/docs/guides/index.ts | head -1 | cut -d: -f1)
          echo "START=$S" >> $GITHUB_STEP_SUMMARY
          echo 'BEGIN' >> $GITHUB_STEP_SUMMARY
          tail -n +$S src/docs/guides/index.ts >> $GITHUB_STEP_SUMMARY
          echo 'END' >> $GITHUB_STEP_SUMMARY
