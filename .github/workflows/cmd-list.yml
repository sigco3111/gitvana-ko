name: cmd-list
on:
  workflow_dispatch:
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: list commands
        run: |
          echo '## CMDS' >> $GITHUB_STEP_SUMMARY
          grep -nE "^\s*name: '" src/docs/commands/index.ts | sed -E "s/^([0-9]+):.*name: '([^']*)'.*/\1 \2/" >> $GITHUB_STEP_SUMMARY
          echo '## END' >> $GITHUB_STEP_SUMMARY
